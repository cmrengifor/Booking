name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Placeholder values only — the build never makes a real Supabase call at
# build time (every route is server-rendered on demand, not statically
# generated), so no real secrets are needed here. Real credentials stay in
# Vercel's own env vars for the actual deploy.
env:
  NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
  NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
  SUPABASE_SERVICE_ROLE_KEY: placeholder

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm run lint

      - run: npm test

      - run: npm run build
