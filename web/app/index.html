<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Salon</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet" />
<style>
  :root {
    --ivory: #F6F1EC; --wine: #6E2A3B; --wine-dark: #56212F; --gold: #B7935B; --sage: #7C8B6F;
    --ink: #2A2220; --muted: #8A7C74; --card: #FFFFFF; --border: #E7DDD3; --danger: #B3432E; --radius: 14px;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--ivory); color: var(--ink); font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; }

  /* ---- top nav (shared) ---- */
  .topnav {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 20px; border-bottom: 1px solid var(--border); background: var(--card);
    position: sticky; top: 0; z-index: 10;
  }
  .topnav .brand { font-family: 'Fraunces', serif; font-weight: 600; font-size: 16px; color: var(--wine); }
  .switch { display: flex; gap: 2px; background: var(--ivory); border-radius: 999px; padding: 3px; }
  .switch button {
    border: none; background: transparent; padding: 7px 14px; border-radius: 999px;
    font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 600; cursor: pointer; color: var(--muted);
  }
  .switch button.active { background: var(--wine); color: #fff; }
  .switch button { position: relative; }
  .notif-badge {
    display: none; position: absolute; top: -4px; right: -4px; min-width: 16px; height: 16px;
    padding: 0 4px; border-radius: 999px; background: var(--danger); color: #fff;
    font-size: 10px; font-weight: 700; align-items: center; justify-content: center; line-height: 1;
  }
  .toast {
    position: fixed; top: 70px; right: 20px; z-index: 100; background: var(--card);
    border: 1px solid var(--border); border-left: 4px solid var(--sage); border-radius: 10px;
    padding: 12px 16px; box-shadow: 0 6px 20px rgba(0,0,0,.12); max-width: 300px;
    font-size: 13px; animation: toast-in .2s ease-out;
  }
  .toast .title { font-weight: 600; margin-bottom: 2px; }
  .toast .meta { color: var(--muted); font-family: 'IBM Plex Mono', monospace; font-size: 12px; }
  @keyframes toast-in { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: translateY(0); } }

  /* ---- client booking widget ---- */
  .app { max-width: 480px; margin: 0 auto; min-height: calc(100vh - 53px); display: flex; flex-direction: column; }
  .app header { padding: 24px 20px 12px; }
  .app h1 { font-family: 'Fraunces', serif; font-weight: 600; font-size: 22px; margin: 0 0 4px; }
  .subtitle { color: var(--muted); font-size: 14px; margin: 0; }
  .steps { display: flex; gap: 6px; padding: 0 20px 16px; }
  .steps .dot { flex: 1; height: 4px; border-radius: 2px; background: var(--border); }
  .steps .dot.done, .steps .dot.active { background: var(--wine); }
  .app main { flex: 1; padding: 0 20px 100px; }
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 16px; margin-bottom: 12px; cursor: pointer; transition: border-color .15s, box-shadow .15s;
  }
  .card:hover { border-color: var(--gold); }
  .card.selected { border-color: var(--wine); box-shadow: 0 0 0 1.5px var(--wine); }
  .card .name { font-weight: 600; font-size: 15px; }
  .card .meta { color: var(--muted); font-size: 13px; margin-top: 2px; font-family: 'IBM Plex Mono', monospace; }
  .card .price { float: right; font-family: 'IBM Plex Mono', monospace; font-weight: 500; color: var(--wine); }
  .empty { color: var(--muted); font-size: 14px; padding: 24px 0; text-align: center; }
  .any-card { border-color: var(--sage); background: #F4F6F1; }
  .any-card .name { color: var(--sage); }
  input[type=date] {
    width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 10px;
    font-family: 'IBM Plex Mono', monospace; font-size: 14px; margin-bottom: 16px; background: var(--card);
  }
  .slots { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .slot {
    padding: 10px 4px; text-align: center; border: 1px solid var(--border); border-radius: 8px;
    font-family: 'IBM Plex Mono', monospace; font-size: 13px; cursor: pointer; background: var(--card);
  }
  .slot:hover { border-color: var(--gold); }
  .slot.selected { background: var(--wine); color: white; border-color: var(--wine); }
  label { display: block; font-size: 13px; font-weight: 500; margin: 12px 0 6px; }
  input[type=text], input[type=tel], input[type=email] {
    width: 100%; padding: 11px 12px; border: 1px solid var(--border); border-radius: 10px;
    font-family: 'Inter', sans-serif; font-size: 14px;
  }
  .app footer {
    position: sticky; bottom: 0; background: linear-gradient(to top, var(--ivory) 70%, transparent);
    padding: 16px 20px 24px;
  }
  .btn {
    padding: 14px; border: none; border-radius: 10px; background: var(--wine); color: white;
    font-family: 'Inter', sans-serif; font-weight: 600; font-size: 15px; cursor: pointer;
  }
  .app footer .btn { width: 100%; }
  .btn:disabled { background: var(--border); color: var(--muted); cursor: not-allowed; }
  .btn.danger { background: var(--danger); }
  .back { color: var(--muted); font-size: 13px; cursor: pointer; margin-bottom: 12px; display: inline-block; }
  .summary { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; margin-bottom: 16px; }
  .summary .row { display: flex; justify-content: space-between; padding: 6px 0; font-size: 14px; border: none; }
  .summary .row .k { color: var(--muted); }
  .success { text-align: center; padding: 40px 0; }
  .success .icon { font-size: 40px; color: var(--sage); }
  .error { color: var(--danger); font-size: 13px; margin-top: 8px; }
  .hint { color: var(--muted); font-size: 12px; margin-top: 10px; text-align: center; }
  .loading { text-align: center; color: var(--muted); padding: 40px 0; font-size: 14px; }

  /* ---- landing page ---- */
  .landing-header { padding: 20px 20px 4px; }
  .landing-header h1 { margin-bottom: 6px; }
  .address-line {
    display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 13px; margin: 0 0 14px;
  }
  .rating-badge {
    display: inline-flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 600;
    background: var(--ivory); border: 1px solid var(--border); border-radius: 999px; padding: 3px 10px; margin-bottom: 14px;
  }
  .rating-badge .stars { color: var(--gold); }
  .photo-gallery {
    display: flex; gap: 8px; overflow-x: auto; padding: 0 20px 20px; margin: 0 -20px; scroll-snap-type: x mandatory;
  }
  .photo-gallery img {
    width: 220px; height: 150px; object-fit: cover; border-radius: 12px; flex-shrink: 0; scroll-snap-align: start;
    background: var(--border);
  }
  .section {
    padding: 24px 20px 4px;
  }
  .section h2 {
    font-family: 'Fraunces', serif; font-weight: 600; font-size: 18px; margin: 0 0 14px;
  }
  .service-row {
    display: flex; justify-content: space-between; align-items: center; background: var(--card);
    border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 10px;
  }
  .service-row .name { font-weight: 600; font-size: 14px; }
  .service-row .meta { color: var(--muted); font-size: 12px; font-family: 'IBM Plex Mono', monospace; margin-top: 2px; }
  .service-row .right { text-align: right; }
  .service-row .price { font-family: 'IBM Plex Mono', monospace; font-weight: 600; color: var(--wine); font-size: 14px; margin-bottom: 6px; }
  .team-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 12px; }
  .team-card {
    text-align: center; cursor: pointer; background: var(--card); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 16px 8px;
  }
  .avatar-faceless {
    width: 56px; height: 56px; border-radius: 50%; background: linear-gradient(135deg, var(--sage), var(--wine));
    color: #fff; display: flex; align-items: center; justify-content: center; margin: 0 auto 10px;
    font-family: 'Fraunces', serif; font-weight: 600; font-size: 20px;
  }
  .avatar-faceless.large { width: 84px; height: 84px; font-size: 28px; }
  .team-card .name { font-weight: 600; font-size: 13px; }
  .team-card .rating { color: var(--muted); font-size: 12px; margin-top: 3px; }
  .review-card { border-bottom: 1px solid var(--border); padding: 14px 0; }
  .review-card:last-child { border-bottom: none; }
  .review-card .head { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
  .review-avatar {
    width: 32px; height: 32px; border-radius: 50%; background: var(--ivory); border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; color: var(--wine);
  }
  .review-card .name { font-weight: 600; font-size: 13px; }
  .review-card .date { color: var(--muted); font-size: 11px; }
  .review-card .stars { color: var(--gold); font-size: 13px; margin-bottom: 4px; }
  .review-card .comment { font-size: 13px; color: var(--ink); }
  .sticky-cta {
    position: sticky; bottom: 0; background: var(--card); border-top: 1px solid var(--border);
    padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; gap: 12px;
  }
  .sticky-cta .info .biz { font-weight: 600; font-size: 13px; }
  .sticky-cta .info .count { color: var(--muted); font-size: 11px; }
  .sticky-cta .btn { padding: 12px 20px; white-space: nowrap; }
  .star-picker { display: flex; gap: 4px; font-size: 28px; }
  .star-picker span { cursor: pointer; color: var(--border); transition: color .1s; }
  .star-picker span.filled { color: var(--gold); }
  textarea {
    width: 100%; padding: 11px 12px; border: 1px solid var(--border); border-radius: 10px;
    font-family: 'Inter', sans-serif; font-size: 14px; resize: vertical; min-height: 70px;
  }
  .profile-header { text-align: center; padding: 24px 20px 8px; }
  .profile-header .bio { color: var(--muted); font-size: 13px; margin-top: 8px; }
  .portfolio-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .portfolio-grid img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 8px; background: var(--border); }

  /* ---- staff admin panel ---- */
  .shell { max-width: 960px; margin: 0 auto; padding: 24px 20px 80px; }
  .shell h1 { font-family: 'Fraunces', serif; font-weight: 600; font-size: 24px; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 13px; margin: 0 0 20px; }
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin-bottom: 20px; }
  .tab { padding: 10px 16px; cursor: pointer; font-size: 14px; font-weight: 500; color: var(--muted); border-bottom: 2px solid transparent; }
  .tab.active { color: var(--wine); border-color: var(--wine); }
  .panel { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 20px; }
  .row { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--border); }
  .row:last-child { border-bottom: none; }
  .row .main { flex: 1; }
  .row .name { font-weight: 600; font-size: 14px; }
  .row .meta { color: var(--muted); font-size: 12px; font-family: 'IBM Plex Mono', monospace; margin-top: 2px; }
  .badge { font-size: 11px; padding: 2px 8px; border-radius: 20px; background: #EEE; color: var(--muted); }
  .badge.active { background: #E7EEE3; color: var(--sage); }
  .badge.inactive { background: #F3E4E0; color: var(--danger); }
  .btn.ghost { background: transparent; color: var(--wine); border: 1px solid var(--wine); }
  .btn.small { padding: 5px 10px; font-size: 12px; }
  .btn.sage { background: var(--sage); }
  form.inline { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-top: 16px; }
  input, select { padding: 9px 10px; border: 1px solid var(--border); border-radius: 8px; font-size: 13px; font-family: 'Inter', sans-serif; width: 100%; }
  label.chk { display: flex; align-items: center; gap: 6px; font-size: 13px; padding: 4px 0; }
  .day-row { display: grid; grid-template-columns: 90px 1fr 1fr auto; gap: 8px; align-items: center; padding: 6px 0; font-size: 13px; }
  .day-row input[type=time] { padding: 6px 8px; }
  .toolbar { display: flex; gap: 10px; align-items: center; margin-bottom: 16px; }
  select.staffpick { max-width: 240px; }
  .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.3); display: flex; align-items: center; justify-content: center; padding: 20px; }
  .modal { background: #fff; border-radius: 14px; padding: 20px; max-width: 420px; width: 100%; max-height: 90vh; overflow: auto; }
</style>
</head>
<body>
<div id="root"></div>
<script>
const API = ""; // same-origin
const DAYS = ["Domingo", "Lunes", "Martes", "Miércoles", "Jueves", "Viernes", "Sábado"];
const params = new URLSearchParams(location.search);
const manageApptId = params.get("appt");

const state = {
  // "client" = public booking widget, "admin" = staff panel. A shared
  // booking-management link (?appt=<id>) always wins and forces client
  // mode, since that's clearly someone following their own booking link.
  mode: manageApptId ? "client" : (params.get("view") === "admin" ? "admin" : "client"),
  book: {
    view: manageApptId ? "manage" : "landing",
    step: 1,
    services: [],
    technicians: [],
    selectedService: null,
    selectedStaffId: undefined, // undefined = any available
    staffLocked: false, // true when entering the flow from a technician's profile
    selectedDate: null,
    slots: [],
    selectedSlot: null,
    hold: null,
    appointment: null,
    error: null,
    manageAppt: null,
    manageError: null,
    manageActionError: null,
    manageReview: null, // { rating, comment } draft while submitting
    manageReviewError: null,
    manageReviewSubmitted: null, // the submitted ReviewRead, once done
    // landing page data
    tenant: null,
    venuePhotos: [],
    venueReviews: null,
    team: [],
    landingLoaded: false,
    // technician profile
    profileStaffId: null,
    profileStaff: null,
    profilePortfolio: [],
    profileReviews: null,
  },
  admin: {
    tab: "services",
    services: [],
    staffList: [],
    hoursStaffId: null,
    workingHours: [],
    timeOff: [],
    calendarDate: new Date().toISOString().slice(0, 10),
    appointments: [],
    bookingModal: null,
    error: null,
    tenant: null,
    venuePhotos: [],
    settingsError: null,
  },
  notifications: {
    since: new Date().toISOString(), // only alert on bookings from now on, not history
    unseen: 0,
  },
};

async function api(path, opts = {}) {
  // FormData needs the browser to set its own multipart boundary header --
  // forcing application/json on it would break the upload.
  const headers = opts.body instanceof FormData ? {} : { "Content-Type": "application/json" };
  const res = await fetch(API + path, { headers, ...opts });
  if (res.status === 204) return null;
  const data = await res.json().catch(() => null);
  if (!res.ok) {
    const err = new Error((data && data.detail) || "Error");
    err.status = res.status;
    throw err;
  }
  return data;
}
function fmtMoney(v) { return "$" + Number(v).toFixed(2); }
function fmtTime(iso) { return new Date(iso).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }); }
function fmtDateTime(iso) { return new Date(iso).toLocaleString([], { weekday: "long", month: "long", day: "numeric", hour: "2-digit", minute: "2-digit" }); }
function initials(name) {
  return (name || "").split(" ").filter(Boolean).slice(0, 2).map(w => w[0].toUpperCase()).join("");
}
function starString(rating) {
  const full = Math.round(rating);
  return "★".repeat(full) + "☆".repeat(5 - full);
}

// ============================== SHELL ==============================
function render() {
  document.title = state.mode === "client" ? "Reservar cita" : "Panel del salón";
  const root = document.getElementById("root");
  root.innerHTML = `
    <div class="topnav">
      <span class="brand">Salon</span>
      <div class="switch">
        <button data-mode="client" class="${state.mode === "client" ? "active" : ""}">Reservar</button>
        <button data-mode="admin" class="${state.mode === "admin" ? "active" : ""}">
          Panel del salón
          <span id="notif-badge" class="notif-badge"></span>
        </button>
      </div>
    </div>
    <div id="content" class="${state.mode === "client" ? "app" : "shell"}"></div>
  `;
  document.querySelectorAll(".switch button").forEach(b => b.onclick = () => switchMode(b.dataset.mode));
  updateNotifBadge();
  if (state.mode === "client") renderClient(); else renderAdmin();
}

function switchMode(mode) {
  state.mode = mode;
  const url = new URL(location.href);
  url.searchParams.set("view", mode);
  if (mode === "admin") url.searchParams.delete("appt");
  history.replaceState(null, "", url);
  if (mode === "admin") { state.notifications.unseen = 0; } // viewing the panel counts as "seen"
  render();
  if (mode === "client") initClient(); else initAdmin();
}

// ============================ LIVE BOOKING NOTIFICATIONS ============================
// Polls for new bookings (reuses the confirmation notifications logged
// on every booking) so staff see an alert without needing to refresh.
// DOM updates here are targeted (badge text, a standalone toast) rather
// than a full render(), so a poll landing mid-keystroke in a form never
// clobbers what the user is typing.
const NOTIF_POLL_INTERVAL_MS = 15000;

function updateNotifBadge() {
  const el = document.getElementById("notif-badge");
  if (!el) return;
  if (state.notifications.unseen > 0) {
    el.textContent = state.notifications.unseen > 9 ? "9+" : state.notifications.unseen;
    el.style.display = "flex";
  } else {
    el.style.display = "none";
  }
}

function showBookingToast(item) {
  const toast = document.createElement("div");
  toast.className = "toast";
  toast.innerHTML = `
    <div class="title">Nueva reserva: ${item.client_name}</div>
    <div class="meta">${fmtDateTime(item.start_time)}</div>
  `;
  document.body.appendChild(toast);
  setTimeout(() => toast.remove(), 6000);
}

async function pollNotifications() {
  try {
    const items = await api(`/notifications/recent?since=${encodeURIComponent(state.notifications.since)}`);
    if (!items.length) return;
    state.notifications.since = items[0].created_at; // items are newest-first
    if (state.mode !== "admin") {
      state.notifications.unseen += items.length;
      updateNotifBadge();
    }
    items.slice().reverse().forEach(showBookingToast);
    if (state.mode === "admin" && state.admin.tab === "calendar") {
      await loadAdminCalendar();
      renderAdmin();
    }
  } catch (e) {
    // transient network hiccups shouldn't interrupt whatever the user is doing
  }
}

function startNotificationPolling() {
  setInterval(pollNotifications, NOTIF_POLL_INTERVAL_MS);
}

// ============================ CLIENT WIDGET ============================
function renderClient() {
  const content = document.getElementById("content");
  const b = state.book;
  if (b.view === "manage") { content.innerHTML = renderManage(); wireManage(); return; }
  if (b.view === "landing") { content.innerHTML = renderLanding(); wireLanding(); return; }
  if (b.view === "team-profile") { content.innerHTML = renderTeamProfile(); wireTeamProfile(); return; }
  content.innerHTML = `
    <header>
      <h1>Reservar cita</h1>
      <p class="subtitle">${["", "Elige un servicio", "Elige tu estilista", "Elige fecha y hora", "Confirma tus datos"][b.step] || ""}</p>
    </header>
    <div class="steps">${[1,2,3,4].map(n => `<div class="dot ${n < b.step ? "done" : n === b.step ? "active" : ""}"></div>`).join("")}</div>
    <main id="main"></main>
  `;
  const main = document.getElementById("main");
  if (b.step === 1) main.innerHTML = renderStep1();
  else if (b.step === 2) main.innerHTML = renderStep2();
  else if (b.step === 3) main.innerHTML = renderStep3();
  else if (b.step === 4) main.innerHTML = renderStep4();
  else if (b.step === 5) main.innerHTML = renderSuccess();
  wireStep();
}

function renderStep1() {
  const b = state.book;
  if (!b.services.length) return `<div class="loading">Cargando servicios...</div>`;
  return `
    <span class="back" id="backToLanding">&larr; Volver al inicio</span>
    ${b.services.map(s => `
      <div class="card" data-id="${s.id}">
        <span class="price">${fmtMoney(s.price)}</span>
        <div class="name">${s.name}</div>
        <div class="meta">${s.duration_minutes} min${s.category ? " · " + s.category : ""}</div>
      </div>
    `).join("")}
  `;
}

function renderStep2() {
  const b = state.book;
  return `
    <span class="back" id="back">&larr; Volver</span>
    <div class="card any-card ${b.selectedStaffId === undefined ? "selected" : ""}" data-id="">
      <div class="name">Cualquier disponible</div>
      <div class="meta">La opción más rápida -- te asignamos a quien tenga espacio</div>
    </div>
    ${b.technicians.map(s => `
      <div class="card ${b.selectedStaffId === s.id ? "selected" : ""}" data-id="${s.id}">
        <div class="name">${s.name}</div>
      </div>
    `).join("")}
    <footer><button class="btn" id="next" ${b.selectedStaffId === null ? "disabled" : ""}>Continuar</button></footer>
  `;
}

function renderStep3() {
  const b = state.book;
  const today = new Date().toISOString().slice(0, 10);
  return `
    <span class="back" id="back">&larr; Volver</span>
    <input type="date" id="date" min="${today}" value="${b.selectedDate || ""}" />
    ${b.loadingSlots ? `<div class="loading">Buscando horarios...</div>` : renderSlots()}
  `;
}

function renderSlots() {
  const b = state.book;
  if (!b.selectedDate) return `<div class="hint">Selecciona una fecha para ver horarios disponibles.</div>`;
  const uniqueTimes = [...new Map(b.slots.map(s => [s.start_time, s])).values()]
    .sort((a, c) => new Date(a.start_time) - new Date(c.start_time));
  if (!uniqueTimes.length) return `<div class="empty">No hay horarios disponibles ese día. Prueba otra fecha.</div>`;
  return `<div class="slots">${uniqueTimes.map(s => `

function renderReviewSection() {

      </div>

      ${b.manageReviewError ? `<div class="error">${b.manageReviewError}</div>` : ""}

    </div>

function wireManage() {
  const b = state.book;
  if (!manageApptId) return;
  if (!b.manageAppt && !b.manageError) {
    api(`/booking/appointments/${manageApptId}`).then(a => {
      b.manageAppt = a; renderClient();
    }).catch(e => { b.manageError = e.message; renderClient(); });
  }
  const cancelBtn = document.getElementById("cancelBtn");
  if (cancelBtn) cancelBtn.onclick = async () => {
    try {
      const a = await api(`/booking/appointments/${manageApptId}/cancel`, { method: "POST", body: JSON.stringify({}) });
      b.manageAppt = a;
      b.manageActionError = null;
    } catch (e) {
      b.manageActionError = e.message;
    }
    renderClient();
  };
  const starPicker = document.getElementById("starPicker");
  if (starPicker) starPicker.querySelectorAll("[data-star]").forEach(el => el.onclick = () => {
    b.manageReview = { ...(b.manageReview || {}), rating: Number(el.dataset.star) };
    renderClient();
  });
  const submitReview = document.getElementById("submitReview");
  if (submitReview) submitReview.onclick = async () => {
    const rating = (b.manageReview && b.manageReview.rating) || 0;
    const comment = document.getElementById("reviewComment").value.trim();
    try {
      const review = await api(`/booking/appointments/${manageApptId}/review`, {
        method: "POST",
        body: JSON.stringify({ rating, comment: comment || null }),
      });
      b.manageReviewSubmitted = review;
      b.manageReviewError = null;
    } catch (e) {
      // A 409 here means a review already exists (e.g. the page was reloaded
      // after submitting) -- treat that as "already done", not an error.
      if (e.status === 409) {
        b.manageReviewSubmitted = { rating: rating || 5 };
        b.manageReviewError = null;
      } else {
        b.manageReviewError = e.message;
      }
    }
    renderClient();
  };
}

function wireStep() {
  const b = state.book;
  document.querySelectorAll(".card[data-id]").forEach(el => {
    el.onclick = () => {
      if (b.step === 1) {
        b.selectedService = b.services.find(s => s.id === el.dataset.id);
        loadTechnicians().then(() => {
          // Coming from a technician's profile ("Reservar con X") -- the
          // technician is already fixed, so skip re-asking for one.
          b.step = b.staffLocked ? 3 : 2;
          renderClient();
        });
      } else if (b.step === 2) {
        b.selectedStaffId = el.dataset.id || undefined;
        renderClient();
      }
    };
  });
  const backToLanding = document.getElementById("backToLanding");
  if (backToLanding) backToLanding.onclick = () => { b.view = "landing"; b.error = null; renderClient(); };
  const back = document.getElementById("back");
  if (back) back.onclick = () => {
    b.error = null;
    if (b.step === 3 && b.staffLocked) {
      // Back to service selection -- the locked technician might not
      // offer whatever service gets picked next, so unlock and let the
      // normal step 2 (technician selection) re-validate that.
      b.staffLocked = false;
      b.step = 1;
    } else {
      b.step -= 1;
    }
    renderClient();
  };
  const next = document.getElementById("next");
  if (next) next.onclick = () => { b.step = 3; renderClient(); };
  const dateInput = document.getElementById("date");
  if (dateInput) dateInput.onchange = async (e) => {
    b.selectedDate = e.target.value;
    b.loadingSlots = true;
    renderClient();
    await loadSlots();
    b.loadingSlots = false;
    renderClient();
  };
  document.querySelectorAll(".slot").forEach(el => { el.onclick = () => selectSlot(el.dataset.time); });
  const confirmBtn = document.getElementById("confirm");
  if (confirmBtn) confirmBtn.onclick = doConfirm;
}

async function loadBookServices() { state.book.services = await api("/services"); renderClient(); }
async function loadTechnicians() { state.book.technicians = await api(`/booking/staff?service_id=${state.book.selectedService.id}`); }
async function loadSlots() {
  const b = state.book;
  const staffParam = b.selectedStaffId ? `&staff_id=${b.selectedStaffId}` : "";
  b.slots = await api(`/booking/availability?service_id=${b.selectedService.id}&target_date=${b.selectedDate}${staffParam}`);
}

async function selectSlot(startTime) {
  const b = state.book;
  b.error = null;
  try {
    const hold = await api("/booking/hold", {
      method: "POST",
      body: JSON.stringify({ service_id: b.selectedService.id, start_time: startTime, staff_id: b.selectedStaffId || null }),
    });
    b.hold = hold;
    b.selectedSlot = { start_time: startTime };
    b.step = 4;
    renderClient();
  } catch (e) {
    b.error = e.message;
    await loadSlots();
    renderClient();
  }
}

async function doConfirm() {
  const b = state.book;
  b.error = null;
  const name = document.getElementById("c_name").value.trim();
  const phone = document.getElementById("c_phone").value.trim();
  const email = document.getElementById("c_email").value.trim();
  if (!name || !phone) { b.error = "Nombre y teléfono son obligatorios."; renderClient(); return; }
  try {
    const appt = await api("/booking/confirm", {
      method: "POST",
      body: JSON.stringify({
        hold_token: b.hold.hold_token,
        service_id: b.selectedService.id,
        client: { name, phone, email: email || null },
        booking_mode: b.selectedStaffId ? "client_choice" : "any_available",
      }),
    });
    b.appointment = appt;
    b.step = 5;
    renderClient();
  } catch (e) {
    b.error = e.message;
    renderClient();
  }
}

function initClient() {
  const b = state.book;
  if (b.view === "step" && !b.services.length) loadBookServices();

        <button class="btn small danger" data-del-timeoff="${t.id}">Eliminar</button>
      </div>
    `).join("") || `<div class="empty">Sin días libres registrados.</div>`}
    <form class="inline" id="timeOffForm">
      <input name="start_at" type="date" required />
      <input name="end_at" type="date" required />
      <input name="reason" placeholder="Motivo (opcional)" />
      <button class="btn" type="submit">Agregar</button>
    </form>
  `;
}

function renderAdminCalendar() {
  const a = state.admin;
  return `
    <div class="toolbar">
      <input type="date" id="calDate" value="${a.calendarDate}" />
      <button class="btn sage" id="newBooking">+ Nueva reserva</button>
    </div>
    ${a.appointments.map(ap => `
      <div class="row">
        <div class="main">
          <span class="name">${fmtTime(ap.start_time)} · ${ap.client_name}</span>
          <span class="badge">${ap.status}</span>
          <div class="meta">${ap.staff_name} · ${ap.service_names.join(", ") || "—"} · ${fmtMoney(ap.price_total)}</div>
        </div>
        ${ap.status === "confirmed" ? `
          <button class="btn small sage" data-status="${ap.id}" data-set="completed">Completada</button>
          <button class="btn small ghost" data-status="${ap.id}" data-set="no_show">No llegó</button>
          <button class="btn small danger" data-status="${ap.id}" data-set="cancelled">Cancelar</button>
        ` : ""}
      </div>
    `).join("") || `<div class="empty">Sin reservas para este día.</div>`}
  `;
}

function renderAdminSettings() {
  const a = state.admin;
  const t = a.tenant || {};
  return `
    <h3 style="font-size:14px;margin:0 0 12px;">Información del salón</h3>
    <form class="inline" id="settingsForm" style="grid-template-columns: 1fr 1fr;">
      <input name="name" placeholder="Nombre del salón" value="${t.name || ""}" required />
      <input name="address" placeholder="Dirección" value="${t.address || ""}" />
      <button class="btn" type="submit" style="grid-column: 1 / -1;">Guardar</button>
    </form>
    ${a.settingsError ? `<div class="error">${a.settingsError}</div>` : ""}
    <hr style="border:none;border-top:1px solid var(--border);margin:20px 0;" />
    <h3 style="font-size:14px;margin:0 0 12px;">Fotos del local</h3>
    <p class="sub" style="margin:-6px 0 12px;">Fachada e interior -- ayudan a los clientes a ubicar el local y saber qué esperar.</p>
    <div class="portfolio-grid" style="margin-bottom:14px;">
      ${a.venuePhotos.map(p => `
        <div style="position:relative;">
          <img src="${p.image_path}" style="width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;" />
          <button class="btn small danger" data-del-venue-photo="${p.id}" style="position:absolute;top:4px;right:4px;padding:2px 8px;">×</button>
        </div>
      `).join("") || `<div class="empty">Sin fotos aún.</div>`}
    </div>
    <input type="file" id="venuePhotoInput" accept="image/*" />
  `;
}

function renderBookingModal() {
  const a = state.admin;
  const m = a.bookingModal;
  const wrap = document.createElement("div");
  wrap.className = "modal-bg";
  wrap.innerHTML = `
    <div class="modal">
      <h3 style="margin-top:0;">Nueva reserva</h3>
      <label>Servicio</label>
      <select id="m_service">${a.services.filter(s => s.active).map(s => `<option value="${s.id}">${s.name}</option>`).join("")}</select>
      <label style="margin-top:8px;display:block;">Estilista</label>
      <select id="m_staff"><option value="">Cualquier disponible</option>${a.staffList.filter(s=>s.active).map(s => `<option value="${s.id}">${s.name}</option>`).join("")}</select>
      <label style="margin-top:8px;display:block;">Fecha</label>
      <input type="date" id="m_date" value="${a.calendarDate}" />
      <div id="m_slots" style="margin-top:8px;font-size:13px;color:var(--muted);">Elige servicio, fecha y presiona "Buscar horarios".</div>
      <button class="btn ghost" id="m_search" style="margin-top:8px;">Buscar horarios</button>
      <div id="m_slotList" style="display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;"></div>
      <label style="margin-top:12px;display:block;">Nombre del cliente</label>
      <input id="m_name" />
      <label style="margin-top:8px;display:block;">Teléfono</label>
      <input id="m_phone" />
      ${m.error ? `<div class="error">${m.error}</div>` : ""}
      <div style="display:flex;gap:8px;margin-top:16px;">
        <button class="btn" id="m_confirm" disabled>Confirmar reserva</button>
        <button class="btn ghost" id="m_close">Cancelar</button>
      </div>
    </div>
  `;
  document.body.appendChild(wrap);
  let selectedTime = null;
  document.getElementById("m_close").onclick = () => { a.bookingModal = null; wrap.remove(); };
  document.getElementById("m_search").onclick = async () => {
    const serviceId = document.getElementById("m_service").value;
    const staffId = document.getElementById("m_staff").value;
    const dateVal = document.getElementById("m_date").value;
    const staffParam = staffId ? `&staff_id=${staffId}` : "";
    const slots = await api(`/booking/availability?service_id=${serviceId}&target_date=${dateVal}${staffParam}`);
    const unique = [...new Map(slots.map(s => [s.start_time, s])).values()];
    const list = document.getElementById("m_slotList");
    list.innerHTML = unique.map(s => `<button class="btn small ghost" data-time="${s.start_time}">${fmtTime(s.start_time)}</button>`).join("") || "Sin horarios disponibles.";
    list.querySelectorAll("button").forEach(btn => btn.onclick = () => {
      selectedTime = btn.dataset.time;
      list.querySelectorAll("button").forEach(x => x.className = "btn small ghost");
      btn.className = "btn small";
      document.getElementById("m_confirm").disabled = false;
    });
  };
  document.getElementById("m_confirm").onclick = async () => {
    try {
      const serviceId = document.getElementById("m_service").value;
      const staffId = document.getElementById("m_staff").value || null;
      const name = document.getElementById("m_name").value.trim();
      const phone = document.getElementById("m_phone").value.trim();
      if (!name || !phone || !selectedTime) { m.error = "Completa todos los campos y elige un horario."; renderBookingModal(); wrap.remove(); return; }
      await api("/appointments", {
        method: "POST",
        body: JSON.stringify({ service_id: serviceId, staff_id: staffId, start_time: selectedTime, client: { name, phone } }),
      });
      a.bookingModal = null;
      wrap.remove();
      await loadAdminCalendar();
      renderAdmin();
    } catch (e) {
      m.error = e.message;
      wrap.remove();
      renderBookingModal();
    }
  };
}

function wireAdminTab() {
  const a = state.admin;
  if (a.tab === "services") {
    document.getElementById("svcForm").onsubmit = async (e) => {
      e.preventDefault();
      const f = new FormData(e.target);
      try {
        await api("/services", { method: "POST", body: JSON.stringify({
          name: f.get("name"), category: f.get("category") || null,
          duration_minutes: Number(f.get("duration_minutes")), buffer_minutes: Number(f.get("buffer_minutes") || 0),
          price: Number(f.get("price")),
        }) });
        a.error = null;
        await loadAdminServices(); renderAdmin();
      } catch (err) { a.error = err.message; renderAdmin(); }
    };
    document.querySelectorAll("[data-toggle]").forEach(btn => btn.onclick = async () => {
      await api(`/services/${btn.dataset.toggle}`, { method: "PATCH", body: JSON.stringify({ active: btn.dataset.active !== "true" }) });
      await loadAdminServices(); renderAdmin();
    });
  } else if (a.tab === "staff") {
    document.getElementById("staffForm").onsubmit = async (e) => {
      e.preventDefault();
      const f = new FormData(e.target);
      try {
        await api("/staff", { method: "POST", body: JSON.stringify({ name: f.get("name"), phone: f.get("phone") || null, email: f.get("email") || null }) });
        a.error = null;
        await loadAdminStaff(); renderAdmin();
      } catch (err) { a.error = err.message; renderAdmin(); }
    };
    document.querySelectorAll("[data-toggle-staff]").forEach(btn => btn.onclick = async () => {
      await api(`/staff/${btn.dataset.toggleStaff}`, { method: "PATCH", body: JSON.stringify({ active: btn.dataset.active !== "true" }) });
      await loadAdminStaff(); renderAdmin();
    });
    document.querySelectorAll("[data-services]").forEach(btn => btn.onclick = () => openServicesModal(btn.dataset.services));
    document.querySelectorAll("[data-profile]").forEach(btn => btn.onclick = () => openProfileModal(btn.dataset.profile));
  } else if (a.tab === "hours") {
    const pick = document.getElementById("hoursStaffPick");
    if (pick) pick.onchange = async (e) => { a.hoursStaffId = e.target.value; await loadAdminHours(); renderAdmin(); };
    document.querySelectorAll("[data-day]").forEach(cb => cb.onchange = (e) => {
      const dow = e.target.dataset.day;
      document.querySelector(`[data-day-start="${dow}"]`).disabled = !e.target.checked;
      document.querySelector(`[data-day-end="${dow}"]`).disabled = !e.target.checked;
    });
    const saveBtn = document.getElementById("saveHours");
    if (saveBtn) saveBtn.onclick = async () => {
      const hours = [];
      document.querySelectorAll("[data-day]").forEach(cb => {
        if (cb.checked) {
          const dow = cb.dataset.day;
          hours.push({
            day_of_week: Number(dow),
            start_time: document.querySelector(`[data-day-start="${dow}"]`).value,
            end_time: document.querySelector(`[data-day-end="${dow}"]`).value,
          });
        }
      });
      try {
        await api(`/staff/${a.hoursStaffId}/working-hours`, { method: "PUT", body: JSON.stringify({ hours }) });
        a.error = null;
        await loadAdminHours(); renderAdmin();
      } catch (err) { a.error = err.message; renderAdmin(); }
    };
    const toForm = document.getElementById("timeOffForm");
    if (toForm) toForm.onsubmit = async (e) => {
      e.preventDefault();
      const f = new FormData(e.target);
      await api(`/staff/${a.hoursStaffId}/time-off`, { method: "POST", body: JSON.stringify({
        start_at: f.get("start_at") + "T00:00:00", end_at: f.get("end_at") + "T23:59:59", reason: f.get("reason") || null,
      }) });
      await loadAdminHours(); renderAdmin();
    };
    document.querySelectorAll("[data-del-timeoff]").forEach(btn => btn.onclick = async () => {
      await api(`/staff/${a.hoursStaffId}/time-off/${btn.dataset.delTimeoff}`, { method: "DELETE" });
      await loadAdminHours(); renderAdmin();
    });
  } else if (a.tab === "calendar") {
    document.getElementById("calDate").onchange = async (e) => { a.calendarDate = e.target.value; await loadAdminCalendar(); renderAdmin(); };
    document.getElementById("newBooking").onclick = () => { a.bookingModal = { error: null }; renderAdmin(); };
    document.querySelectorAll("[data-status]").forEach(btn => btn.onclick = async () => {
      await api(`/appointments/${btn.dataset.status}/status`, { method: "PATCH", body: JSON.stringify({ status: btn.dataset.set }) });
      await loadAdminCalendar(); renderAdmin();
    });
  } else if (a.tab === "settings") {
    document.getElementById("settingsForm").onsubmit = async (e) => {
      e.preventDefault();
      const f = new FormData(e.target);
      try {
        await api("/tenant", { method: "PATCH", body: JSON.stringify({
          name: f.get("name"), address: f.get("address") || null,
        }) });
        a.settingsError = null;
        await loadAdminSettings(); renderAdmin();
      } catch (err) { a.settingsError = err.message; renderAdmin(); }
    };
    document.getElementById("venuePhotoInput").onchange = async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const form = new FormData();
      form.append("file", file);
      await api("/tenant/photos", { method: "POST", body: form });
      await loadAdminSettings(); renderAdmin();
    };
    document.querySelectorAll("[data-del-venue-photo]").forEach(btn => btn.onclick = async () => {
      await api(`/tenant/photos/${btn.dataset.delVenuePhoto}`, { method: "DELETE" });
      await loadAdminSettings(); renderAdmin();
    });
  }
}

async function openServicesModal(staffId) {
  const a = state.admin;
  const staff = a.staffList.find(s => s.id === staffId);
  const assignedIds = new Set(await api(`/staff/${staffId}/services`));
  const wrap = document.createElement("div");
  wrap.className = "modal-bg";
  wrap.innerHTML = `<div class="modal">
    <h3 style="margin-top:0;">Servicios de ${staff.name}</h3>
    ${a.services.map(s => `<label class="chk"><input type="checkbox" value="${s.id}" ${assignedIds.has(s.id) ? "checked":""}/> ${s.name}</label>`).join("")}
    <div style="display:flex;gap:8px;margin-top:16px;">
      <button class="btn" id="saveServices">Guardar</button>
      <button class="btn ghost" id="closeServices">Cerrar</button>
    </div>
  </div>`;
  document.body.appendChild(wrap);
  document.getElementById("closeServices").onclick = () => wrap.remove();
  document.getElementById("saveServices").onclick = async () => {
    const ids = [...wrap.querySelectorAll("input:checked")].map(i => i.value);
    await api(`/staff/${staffId}/services`, { method: "PUT", body: JSON.stringify({ service_ids: ids }) });
    wrap.remove();
  };
}

async function openProfileModal(staffId) {
  const a = state.admin;
  const staff = a.staffList.find(s => s.id === staffId);
  const portfolio = await api(`/booking/team/${staffId}/portfolio`);
  const wrap = document.createElement("div");
  wrap.className = "modal-bg";

  function renderModalBody() {
    wrap.innerHTML = `<div class="modal">
      <h3 style="margin-top:0;">Perfil público de ${staff.name}</h3>
      <p class="sub" style="margin:-6px 0 10px;">Sin fotos personales -- solo bio y trabajos, tal como lo ve el cliente.</p>
      <label>Bio</label>
      <textarea id="bioInput" placeholder="Breve presentación (opcional)">${staff.bio || ""}</textarea>
      <button class="btn small" id="saveBio" style="margin-top:8px;">Guardar bio</button>
      <hr style="border:none;border-top:1px solid var(--border);margin:16px 0;" />
      <label>Portfolio</label>
      <div class="portfolio-grid" style="margin:8px 0;">
        ${portfolio.map(p => `
          <div style="position:relative;">
            <img src="${p.image_path}" style="width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;" />
            <button class="btn small danger" data-del-portfolio="${p.id}" style="position:absolute;top:4px;right:4px;padding:2px 8px;">×</button>
          </div>
        `).join("") || `<div class="empty">Sin trabajos aún.</div>`}
      </div>
      <input type="file" id="portfolioInput" accept="image/*" />
      <div style="display:flex;gap:8px;margin-top:16px;">
        <button class="btn ghost" id="closeProfile">Cerrar</button>
      </div>
    </div>`;
    document.getElementById("closeProfile").onclick = () => wrap.remove();
    document.getElementById("saveBio").onclick = async () => {
      const bio = document.getElementById("bioInput").value.trim();
      staff.bio = await api(`/staff/${staffId}`, { method: "PATCH", body: JSON.stringify({ bio: bio || null }) }).then(s => s.bio);
    };
    document.getElementById("portfolioInput").onchange = async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const form = new FormData();
      form.append("file", file);
      const image = await api(`/staff/${staffId}/portfolio`, { method: "POST", body: form });
      portfolio.push(image);
      renderModalBody();
    };
    wrap.querySelectorAll("[data-del-portfolio]").forEach(btn => btn.onclick = async () => {
      await api(`/staff/${staffId}/portfolio/${btn.dataset.delPortfolio}`, { method: "DELETE" });
      const idx = portfolio.findIndex(p => p.id === btn.dataset.delPortfolio);
      if (idx >= 0) portfolio.splice(idx, 1);
      renderModalBody();
    });
  }

  document.body.appendChild(wrap);
  renderModalBody();
}

async function loadAdminServices() { state.admin.services = await api("/services?include_inactive=true"); }
async function loadAdminStaff() { state.admin.staffList = await api("/staff?include_inactive=true"); }
async function loadAdminHours() {
  const a = state.admin;
  if (!a.hoursStaffId) return;
  a.workingHours = await api(`/staff/${a.hoursStaffId}/working-hours`);
  a.timeOff = await api(`/staff/${a.hoursStaffId}/time-off`);
}
async function loadAdminCalendar() { state.admin.appointments = await api(`/appointments?start_date=${state.admin.calendarDate}`); }
async function loadAdminSettings() {
  const a = state.admin;
  a.tenant = await api("/tenant");
  a.venuePhotos = await api("/tenant/photos");
}

async function loadAdminTab() {
  const a = state.admin;
  if (a.tab === "services" && !a.services.length) await loadAdminServices();
  if (a.tab === "staff" && !a.staffList.length) await loadAdminStaff();
  if (a.tab === "hours") {
    if (!a.staffList.length) await loadAdminStaff();
    if (!a.hoursStaffId && a.staffList.length) a.hoursStaffId = a.staffList[0].id;
    await loadAdminHours();
  }
  if (a.tab === "calendar") { if (!a.services.length) await loadAdminServices(); if (!a.staffList.length) await loadAdminStaff(); await loadAdminCalendar(); }
  if (a.tab === "settings" && !a.tenant) await loadAdminSettings();
  renderAdmin();
}

function initAdmin() {
  if (!state.admin.services.length) loadAdminServices().then(renderAdmin);
}

// ================================ BOOTSTRAP ================================
render();
if (state.mode === "client") initClient(); else initAdmin();
startNotificationPolling();
</script>
</body>
</html>
