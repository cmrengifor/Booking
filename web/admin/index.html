<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Panel del salón</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet" />
<style>
  :root {
    --ivory: #F6F1EC; --wine: #6E2A3B; --gold: #B7935B; --sage: #7C8B6F;
    --ink: #2A2220; --muted: #8A7C74; --card: #FFFFFF; --border: #E7DDD3; --danger: #B3432E;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--ivory); color: var(--ink); font-family: 'Inter', sans-serif; }
  .shell { max-width: 960px; margin: 0 auto; padding: 24px 20px 80px; }
  h1 { font-family: 'Fraunces', serif; font-weight: 600; font-size: 24px; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 13px; margin: 0 0 20px; }
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin-bottom: 20px; }
  .tab { padding: 10px 16px; cursor: pointer; font-size: 14px; font-weight: 500; color: var(--muted); border-bottom: 2px solid transparent; }
  .tab.active { color: var(--wine); border-color: var(--wine); }
  .panel { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 20px; }
  .row { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--border); }
  .row:last-child { border-bottom: none; }
  .row .main { flex: 1; }
  .row .name { font-weight: 600; font-size: 14px; }
  .row .meta { color: var(--muted); font-size: 12px; font-family: 'IBM Plex Mono', monospace; margin-top: 2px; }
  .badge { font-size: 11px; padding: 2px 8px; border-radius: 20px; background: #EEE; color: var(--muted); }
  .badge.active { background: #E7EEE3; color: var(--sage); }
  .badge.inactive { background: #F3E4E0; color: var(--danger); }
  .btn { padding: 8px 14px; border: none; border-radius: 8px; background: var(--wine); color: #fff; font-size: 13px; font-weight: 600; cursor: pointer; }
  .btn.ghost { background: transparent; color: var(--wine); border: 1px solid var(--wine); }
  .btn.small { padding: 5px 10px; font-size: 12px; }
  .btn.danger { background: var(--danger); }
  .btn.sage { background: var(--sage); }
  form.inline { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-top: 16px; }
  input, select { padding: 9px 10px; border: 1px solid var(--border); border-radius: 8px; font-size: 13px; font-family: 'Inter', sans-serif; width: 100%; }
  label.chk { display: flex; align-items: center; gap: 6px; font-size: 13px; padding: 4px 0; }
  .grid2 { display: grid; grid-template-columns: 220px 1fr; gap: 20px; }
  .day-row { display: grid; grid-template-columns: 90px 1fr 1fr auto; gap: 8px; align-items: center; padding: 6px 0; font-size: 13px; }
  .day-row input[type=time] { padding: 6px 8px; }
  .error { color: var(--danger); font-size: 13px; margin-top: 8px; }
  .empty { color: var(--muted); font-size: 13px; padding: 16px 0; text-align: center; }
  .toolbar { display: flex; gap: 10px; align-items: center; margin-bottom: 16px; }
  select.staffpick { max-width: 240px; }
  .link { color: var(--wine); cursor: pointer; font-size: 12px; font-weight: 600; margin-left: 10px; }
  .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.3); display: flex; align-items: center; justify-content: center; padding: 20px; }
  .modal { background: #fff; border-radius: 14px; padding: 20px; max-width: 420px; width: 100%; max-height: 90vh; overflow: auto; }
</style>
</head>
<body>
<div class="shell" id="app"></div>
<script>
const state = {
  tab: "services",
  services: [],
  staffList: [],
  hoursStaffId: null,
  workingHours: [],
  timeOff: [],
  calendarDate: new Date().toISOString().slice(0, 10),
  appointments: [],
  bookingModal: null, // { service, staff, date, slots, client, error }
  error: null,
};

const DAYS = ["Domingo", "Lunes", "Martes", "Miércoles", "Jueves", "Viernes", "Sábado"];

async function api(path, opts) {
  const res = await fetch(path, { headers: { "Content-Type": "application/json" }, ...opts });
  if (res.status === 204) return null;
  const data = await res.json().catch(() => null);
  if (!res.ok) throw new Error((data && data.detail) || "Error");
  return data;
}
function fmtMoney(v) { return "$" + Number(v).toFixed(2); }
function fmtTime(iso) { return new Date(iso).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }); }

function render() {
  const app = document.getElementById("app");
  app.innerHTML = `
    <h1>Panel del salón</h1>
    <p class="sub">Servicios, personal, horarios y reservas</p>
    <div class="tabs">
      ${["services:Servicios", "staff:Personal", "hours:Horarios", "calendar:Reservas"].map(t => {
        const [key, label] = t.split(":");
        return `<div class="tab ${state.tab === key ? "active" : ""}" data-tab="${key}">${label}</div>`;
      }).join("")}
    </div>
    <div class="panel" id="panel"></div>
  `;
  document.querySelectorAll(".tab").forEach(el => el.onclick = () => { state.tab = el.dataset.tab; render(); loadTab(); });
  const panel = document.getElementById("panel");
  if (state.tab === "services") panel.innerHTML = renderServices();
  else if (state.tab === "staff") panel.innerHTML = renderStaff();
  else if (state.tab === "hours") panel.innerHTML = renderHours();
  else if (state.tab === "calendar") panel.innerHTML = renderCalendar();
  wireTab();
  if (state.bookingModal) renderBookingModal();
}

// ---------- SERVICES ----------
function renderServices() {
  return `
    ${state.services.map(s => `
      <div class="row">
        <div class="main">
          <span class="name">${s.name}</span>
          <span class="badge ${s.active ? "active" : "inactive"}" style="margin-left:8px;">${s.active ? "activo" : "inactivo"}</span>
          <div class="meta">${s.duration_minutes}+${s.buffer_minutes} min · ${fmtMoney(s.price)}${s.category ? " · " + s.category : ""}</div>
        </div>
        <button class="btn small ghost" data-toggle="${s.id}" data-active="${s.active}">${s.active ? "Desactivar" : "Activar"}</button>
      </div>
    `).join("") || `<div class="empty">Aún no hay servicios.</div>`}
    <form class="inline" id="svcForm">
      <input name="name" placeholder="Nombre del servicio" required />
      <input name="category" placeholder="Categoría (opcional)" />
      <input name="duration_minutes" type="number" placeholder="Duración (min)" required min="1" />
      <input name="buffer_minutes" type="number" placeholder="Buffer (min)" value="0" min="0" />
      <input name="price" type="number" step="0.01" placeholder="Precio" required min="0" />
      <button class="btn" type="submit">Agregar servicio</button>
    </form>
    ${state.error ? `<div class="error">${state.error}</div>` : ""}
  `;
}

// ---------- STAFF ----------
function renderStaff() {
  return `
    ${state.staffList.map(s => `
      <div class="row">
        <div class="main">
          <span class="name">${s.name}</span>
          <span class="badge ${s.active ? "active" : "inactive"}" style="margin-left:8px;">${s.active ? "activo" : "inactivo"}</span>
          <div class="meta">${s.phone || ""}</div>
        </div>
        <button class="btn small ghost" data-services="${s.id}">Servicios</button>
        <button class="btn small ghost" data-toggle-staff="${s.id}" data-active="${s.active}">${s.active ? "Desactivar" : "Activar"}</button>
      </div>
    `).join("") || `<div class="empty">Aún no hay personal.</div>`}
    <form class="inline" id="staffForm">
      <input name="name" placeholder="Nombre" required />
      <input name="phone" placeholder="Teléfono" />
      <input name="email" placeholder="Email (opcional)" />
      <button class="btn" type="submit">Agregar personal</button>
    </form>
    ${state.error ? `<div class="error">${state.error}</div>` : ""}
  `;
}

// ---------- WORKING HOURS ----------
function renderHours() {
  const opts = state.staffList.map(s => `<option value="${s.id}" ${state.hoursStaffId === s.id ? "selected" : ""}>${s.name}</option>`).join("");
  const byDay = {};
  state.workingHours.forEach(h => { byDay[h.day_of_week] = h; });
  return `
    <div class="toolbar">
      <select class="staffpick" id="hoursStaffPick">${opts}</select>
    </div>
    ${DAYS.map((label, dow) => {
      const h = byDay[dow];
      return `<div class="day-row">
        <label class="chk"><input type="checkbox" data-day="${dow}" ${h ? "checked" : ""}/> ${label}</label>
        <input type="time" data-day-start="${dow}" value="${h ? h.start_time.slice(0,5) : "09:00"}" ${h ? "" : "disabled"}/>
        <input type="time" data-day-end="${dow}" value="${h ? h.end_time.slice(0,5) : "17:00"}" ${h ? "" : "disabled"}/>
        <span></span>
      </div>`;
    }).join("")}
    <button class="btn" id="saveHours" style="margin-top:14px;">Guardar horario</button>
    ${state.error ? `<div class="error">${state.error}</div>` : ""}
    <hr style="border:none;border-top:1px solid var(--border);margin:20px 0;" />
    <h3 style="font-size:14px;margin:0 0 10px;">Días libres / vacaciones</h3>
    ${state.timeOff.map(t => `
      <div class="row">
        <div class="main"><span class="name">${new Date(t.start_at).toLocaleDateString()} - ${new Date(t.end_at).toLocaleDateString()}</span>
        <div class="meta">${t.reason || ""}</div></div>
        <button class="btn small danger" data-del-timeoff="${t.id}">Eliminar</button>
      </div>
    `).join("") || `<div class="empty">Sin días libres registrados.</div>`}
    <form class="inline" id="timeOffForm">
      <input name="start_at" type="date" required />
      <input name="end_at" type="date" required />
      <input name="reason" placeholder="Motivo (opcional)" />
      <button class="btn" type="submit">Agregar</button>
    </form>
  `;
}

// ---------- CALENDAR ----------
function renderCalendar() {
  return `
    <div class="toolbar">
      <input type="date" id="calDate" value="${state.calendarDate}" />
      <button class="btn sage" id="newBooking">+ Nueva reserva</button>
    </div>
    ${state.appointments.map(a => `
      <div class="row">
        <div class="main">
          <span class="name">${fmtTime(a.start_time)} · ${a.client_name}</span>
          <span class="badge">${a.status}</span>
          <div class="meta">${a.staff_name} · ${a.service_names.join(", ") || "—"} · ${fmtMoney(a.price_total)}</div>
        </div>
        ${a.status === "confirmed" ? `
          <button class="btn small sage" data-status="${a.id}" data-set="completed">Completada</button>
          <button class="btn small ghost" data-status="${a.id}" data-set="no_show">No llegó</button>
          <button class="btn small danger" data-status="${a.id}" data-set="cancelled">Cancelar</button>
        ` : ""}
      </div>
    `).join("") || `<div class="empty">Sin reservas para este día.</div>`}
  `;
}

function renderBookingModal() {
  const m = state.bookingModal;
  const wrap = document.createElement("div");
  wrap.className = "modal-bg";
  wrap.innerHTML = `
    <div class="modal">
      <h3 style="margin-top:0;">Nueva reserva</h3>
      <label>Servicio</label>
      <select id="m_service">${state.services.filter(s => s.active).map(s => `<option value="${s.id}">${s.name}</option>`).join("")}</select>
      <label style="margin-top:8px;display:block;">Estilista</label>
      <select id="m_staff"><option value="">Cualquier disponible</option>${state.staffList.filter(s=>s.active).map(s => `<option value="${s.id}">${s.name}</option>`).join("")}</select>
      <label style="margin-top:8px;display:block;">Fecha</label>
      <input type="date" id="m_date" value="${state.calendarDate}" />
      <div id="m_slots" style="margin-top:8px;font-size:13px;color:var(--muted);">Elige servicio, fecha y presiona "Buscar horarios".</div>
      <button class="btn ghost" id="m_search" style="margin-top:8px;">Buscar horarios</button>
      <div id="m_slotList" style="display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;"></div>
      <label style="margin-top:12px;display:block;">Nombre del cliente</label>
      <input id="m_name" />
      <label style="margin-top:8px;display:block;">Teléfono</label>
      <input id="m_phone" />
      ${m.error ? `<div class="error">${m.error}</div>` : ""}
      <div style="display:flex;gap:8px;margin-top:16px;">
        <button class="btn" id="m_confirm" disabled>Confirmar reserva</button>
        <button class="btn ghost" id="m_close">Cancelar</button>
      </div>
    </div>
  `;
  document.body.appendChild(wrap);
  let selectedTime = null;
  document.getElementById("m_close").onclick = () => { state.bookingModal = null; wrap.remove(); };
  document.getElementById("m_search").onclick = async () => {
    const serviceId = document.getElementById("m_service").value;
    const staffId = document.getElementById("m_staff").value;
    const dateVal = document.getElementById("m_date").value;
    const staffParam = staffId ? `&staff_id=${staffId}` : "";
    const slots = await api(`/booking/availability?service_id=${serviceId}&target_date=${dateVal}${staffParam}`);
    const unique = [...new Map(slots.map(s => [s.start_time, s])).values()];
    const list = document.getElementById("m_slotList");
    list.innerHTML = unique.map(s => `<button class="btn small ghost" data-time="${s.start_time}">${fmtTime(s.start_time)}</button>`).join("") || "Sin horarios disponibles.";
    list.querySelectorAll("button").forEach(b => b.onclick = () => {
      selectedTime = b.dataset.time;
      list.querySelectorAll("button").forEach(x => x.className = "btn small ghost");
      b.className = "btn small";
      document.getElementById("m_confirm").disabled = false;
    });
  };
  document.getElementById("m_confirm").onclick = async () => {
    try {
      const serviceId = document.getElementById("m_service").value;
      const staffId = document.getElementById("m_staff").value || null;
      const name = document.getElementById("m_name").value.trim();
      const phone = document.getElementById("m_phone").value.trim();
      if (!name || !phone || !selectedTime) { m.error = "Completa todos los campos y elige un horario."; renderBookingModal(); wrap.remove(); return; }
      await api("/appointments", {
        method: "POST",
        body: JSON.stringify({ service_id: serviceId, staff_id: staffId, start_time: selectedTime, client: { name, phone } }),
      });
      state.bookingModal = null;
      wrap.remove();
      await loadCalendar();
      render();
    } catch (e) {
      m.error = e.message;
      wrap.remove();
      renderBookingModal();
    }
  };
}

function wireTab() {
  if (state.tab === "services") {
    document.getElementById("svcForm").onsubmit = async (e) => {
      e.preventDefault();
      const f = new FormData(e.target);
      try {
        await api("/services", { method: "POST", body: JSON.stringify({
          name: f.get("name"), category: f.get("category") || null,
          duration_minutes: Number(f.get("duration_minutes")), buffer_minutes: Number(f.get("buffer_minutes") || 0),
          price: Number(f.get("price")),
        }) });
        state.error = null;
        await loadServices(); render();
      } catch (err) { state.error = err.message; render(); }
    };
    document.querySelectorAll("[data-toggle]").forEach(b => b.onclick = async () => {
      await api(`/services/${b.dataset.toggle}`, { method: "PATCH", body: JSON.stringify({ active: b.dataset.active !== "true" }) });
      await loadServices(); render();
    });
  } else if (state.tab === "staff") {
    document.getElementById("staffForm").onsubmit = async (e) => {
      e.preventDefault();
      const f = new FormData(e.target);
      try {
        await api("/staff", { method: "POST", body: JSON.stringify({ name: f.get("name"), phone: f.get("phone") || null, email: f.get("email") || null }) });
        state.error = null;
        await loadStaff(); render();
      } catch (err) { state.error = err.message; render(); }
    };
    document.querySelectorAll("[data-toggle-staff]").forEach(b => b.onclick = async () => {
      await api(`/staff/${b.dataset.toggleStaff}`, { method: "PATCH", body: JSON.stringify({ active: b.dataset.active !== "true" }) });
      await loadStaff(); render();
    });
    document.querySelectorAll("[data-services]").forEach(b => b.onclick = () => openServicesModal(b.dataset.services));
  } else if (state.tab === "hours") {
    const pick = document.getElementById("hoursStaffPick");
    if (pick) pick.onchange = async (e) => { state.hoursStaffId = e.target.value; await loadHours(); render(); };
    document.querySelectorAll("[data-day]").forEach(cb => cb.onchange = (e) => {
      const dow = e.target.dataset.day;
      const startInput = document.querySelector(`[data-day-start="${dow}"]`);
      const endInput = document.querySelector(`[data-day-end="${dow}"]`);
      startInput.disabled = !e.target.checked;
      endInput.disabled = !e.target.checked;
    });
    const saveBtn = document.getElementById("saveHours");
    if (saveBtn) saveBtn.onclick = async () => {
      const hours = [];
      document.querySelectorAll("[data-day]").forEach(cb => {
        if (cb.checked) {
          const dow = cb.dataset.day;
          hours.push({
            day_of_week: Number(dow),
            start_time: document.querySelector(`[data-day-start="${dow}"]`).value,
            end_time: document.querySelector(`[data-day-end="${dow}"]`).value,
          });
        }
      });
      try {
        await api(`/staff/${state.hoursStaffId}/working-hours`, { method: "PUT", body: JSON.stringify({ hours }) });
        state.error = null;
        await loadHours(); render();
      } catch (err) { state.error = err.message; render(); }
    };
    const toForm = document.getElementById("timeOffForm");
    if (toForm) toForm.onsubmit = async (e) => {
      e.preventDefault();
      const f = new FormData(e.target);
      await api(`/staff/${state.hoursStaffId}/time-off`, { method: "POST", body: JSON.stringify({
        start_at: f.get("start_at") + "T00:00:00", end_at: f.get("end_at") + "T23:59:59", reason: f.get("reason") || null,
      }) });
      await loadHours(); render();
    };
    document.querySelectorAll("[data-del-timeoff]").forEach(b => b.onclick = async () => {
      await api(`/staff/${state.hoursStaffId}/time-off/${b.dataset.delTimeoff}`, { method: "DELETE" });
      await loadHours(); render();
    });
  } else if (state.tab === "calendar") {
    document.getElementById("calDate").onchange = async (e) => { state.calendarDate = e.target.value; await loadCalendar(); render(); };
    document.getElementById("newBooking").onclick = () => { state.bookingModal = { error: null }; render(); };
    document.querySelectorAll("[data-status]").forEach(b => b.onclick = async () => {
      await api(`/appointments/${b.dataset.status}/status`, { method: "PATCH", body: JSON.stringify({ status: b.dataset.set }) });
      await loadCalendar(); render();
    });
  }
}

async function openServicesModal(staffId) {
  const staff = state.staffList.find(s => s.id === staffId);
  const assignedIds = new Set(await api(`/staff/${staffId}/services`));
  const wrap = document.createElement("div");
  wrap.className = "modal-bg";
  wrap.innerHTML = `<div class="modal">
    <h3 style="margin-top:0;">Servicios de ${staff.name}</h3>
    ${state.services.map(s => `<label class="chk"><input type="checkbox" value="${s.id}" ${assignedIds.has(s.id) ? "checked":""}/> ${s.name}</label>`).join("")}
    <div style="display:flex;gap:8px;margin-top:16px;">
      <button class="btn" id="saveServices">Guardar</button>
      <button class="btn ghost" id="closeServices">Cerrar</button>
    </div>
  </div>`;
  document.body.appendChild(wrap);
  document.getElementById("closeServices").onclick = () => wrap.remove();
  document.getElementById("saveServices").onclick = async () => {
    const ids = [...wrap.querySelectorAll("input:checked")].map(i => i.value);
    await api(`/staff/${staffId}/services`, { method: "PUT", body: JSON.stringify({ service_ids: ids }) });
    wrap.remove();
  };
}

async function loadServices() { state.services = await api("/services?include_inactive=true"); }
async function loadStaff() { state.staffList = await api("/staff?include_inactive=true"); }
async function loadHours() {
  if (!state.hoursStaffId) return;
  state.workingHours = await api(`/staff/${state.hoursStaffId}/working-hours`);
  state.timeOff = await api(`/staff/${state.hoursStaffId}/time-off`);
}
async function loadCalendar() { state.appointments = await api(`/appointments?start_date=${state.calendarDate}`); }

async function loadTab() {
  if (state.tab === "services" && !state.services.length) await loadServices();
  if (state.tab === "staff" && !state.staffList.length) await loadStaff();
  if (state.tab === "hours") {
    if (!state.staffList.length) await loadStaff();
    if (!state.hoursStaffId && state.staffList.length) state.hoursStaffId = state.staffList[0].id;
    await loadHours();
  }
  if (state.tab === "calendar") { if (!state.services.length) await loadServices(); if (!state.staffList.length) await loadStaff(); await loadCalendar(); }
  render();
}

(async function init() {
  await loadServices();
  render();
})();
</script>
</body>
</html>
